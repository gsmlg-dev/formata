name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "28.5"
          - elixir: "1.20.4"
            otp: "28.5"
            lint: true
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - name: Compile Erlang sources with warnings as errors
        run: |
          erlang_build_dir=$(mktemp -d)
          trap 'rm -r "$erlang_build_dir"' EXIT
          erlc -Werror +warn_deprecated_catch -I include -o "$erlang_build_dir" src/*.erl
      - run: mix format --check-formatted
        if: matrix.lint
      - run: mix compile --warnings-as-errors --force

  native-export-dialyzer:
    name: Native export Dialyzer (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19.5"
            otp: "28.5.0.5"
          - elixir: "1.20.4"
            otp: "28.5"
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@v4
        with:
          path: _build/prod/native_export_dialyzer
          key: native-export-plt-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ github.sha }}
          restore-keys: |
            native-export-plt-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-
      - run: mix run --no-start scripts/check_native_export_dialyzer.exs

  package:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "28.5"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-dev-1.20.4-28.5-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix docs
      - run: mix hex.build
